name: Bug report
description: Report a defect or data-credibility issue
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what actually happened?
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where / how to reproduce
      description: URL, steps, browser/OS.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Calculator correctness
        - Data credibility / sources
        - Accessibility
        - SEO
        - Other
    validations:
      required: false
  - type: markdown
    attributes:
      value: "Include exact numbers for calculator/remittance bugs (amount, currency, expected vs actual)."
