# Secret scanning configuration.
# See https://docs.github.com/code-security/secret-scanning.
#
# This config primarily documents push-protection rules and allows extra
# custom patterns. GitHub-managed secret scanning runs automatically once
# enabled in the repository settings.
name: "Secret scanning"

# Enable push protection so developers are blocked from pushing secrets that
# match managed or custom patterns.
github_org_secret_scanning:
  push_protection:
    enabled: true

# Non-provider patterns treated as secrets in this repository.
nonProviderPatterns:
  - name: Example private API key
    pattern: (API_KEY|api[_-]?key)=["']?[A-Za-z0-9]{20,}
  - name: Generic bearer token
    pattern: (Authorization|Bearer)\s*=\s*["']?Bearer\s+[A-Za-z0-9._~+/=-]{20,}
