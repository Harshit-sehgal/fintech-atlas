name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:scripts
      - run: npm run lint -- --max-warnings=0
      - run: npm test
      - run: SITE_URL=https://ci.fintech-atlas.test npm run build
