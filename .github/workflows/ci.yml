name: CI

on:
  pull_request:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:scripts
      # Provenance migration gates: fail on any *invalid* migrated record
      # (low coverage is informational, not a failure).
      - run: npm run check:provenance
      - run: npm run lint -- --max-warnings=0
      - run: npm run test:links
      # `test:coverage` enforces the coverage thresholds in vitest.config.mts.
      - run: npm run test:coverage
      # Production-dependency audit. `--production` excludes dev-only tooling
      # (@lhci/cli → inquirer → tmp) that is never shipped or reachable at
      # runtime; those dev findings are tracked in SECURITY_AUDIT_TRIAGE.md.
      # Fails only on high/critical advisories affecting shipped code.
      - run: npm audit --production --audit-level=high
      - run: SITE_URL=https://ci.fintech-atlas.test npm run build
      - name: Archive verified static artifact
        uses: actions/upload-artifact@v4
        with:
          name: fintech-atlas-static-${{ github.sha }}
          path: out
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  artifact-restore:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fintech-atlas-static-${{ github.sha }}
          path: out
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: ARTIFACT_DIR=out NEXT_PUBLIC_BASE_PATH= npm run check:artifact

  # End-to-end browser tests against the static export (Playwright).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: SITE_URL=https://ci.fintech-atlas.test npm run build
      - run: npm run test:e2e
