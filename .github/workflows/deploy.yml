# Continuous deployment to GitHub Pages.
# Builds the static export on every push to main and publishes it, so the site
# is live with zero external accounts. For a custom domain / Netlify / Vercel,
# set SITE_URL below and use that host's own integration instead (or in addition).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build static export
        # Set SITE_URL to your Pages URL (or override it for a custom domain).
        run: SITE_URL=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }} npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
